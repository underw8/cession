# SonarQube Cloud, under the GitHub-imported organization.
sonar.projectKey=underw8_cession
sonar.organization=underw8
sonar.projectName=cession

sonar.sources=server/src,server/public,plugin,widget/src,widget/ui
sonar.tests=server/test
# The plugin's end-to-end script is a test, not product code; generated and build output never is.
sonar.exclusions=**/node_modules/**,**/coverage/**,server/worker-configuration.d.ts,widget/target/**,widget/gen/**,plugin/test.sh

# Written by `npm run coverage` in server/; quality_gate.yml makes its paths absolute.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info

sonar.sourceEncoding=UTF-8
